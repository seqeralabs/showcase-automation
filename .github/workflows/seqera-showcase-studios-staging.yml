name: seqera-showcase-autotest-studios-staging
run-name: run-studios
# Triggers workflow runs on demand or with schedule.
# workflow_dispatch: Manually trigger workflow from Actions tab.
#   dryrun: Whether to do a dry run without creating a studio.
#   timer: Soak period the studio is kept running before it is stopped.
#   remove/force: Delete the studio after completion.
#   template: Override the studio template declared in studios/*.yaml.
# schedule: Cron schedule to trigger runs automatically.
on:
  # TEMPORARY, remove before merging: a pull_request run (with every job skipped)
  # registers this new workflow so it can be dispatched against the branch with
  # `gh workflow run seqera-showcase-studios-staging.yml --ref <branch>` before
  # the file exists on main. See the workflow_dispatch guards on both jobs.
  pull_request:
    paths:
      - .github/workflows/seqera-showcase-studios-staging.yml
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Dryrun (do not create studio)"
        default: false
        type: boolean
        required: false
      timer:
        description: "Soak period (studio kept running before stop)"
        default: delay15mins
        type: choice
        options:
          - noDelay
          - delay1mins
          - delay5mins
          - delay15mins
          - delay30mins
          - delay60mins
          - delay120mins
          - delay360mins
          - delay720mins
          - waitForReviewer
      remove:
        description: Delete studio
        default: true
        type: boolean
        required: false
      force:
        description: Force delete studio (even if it did not stop cleanly)
        default: false
        type: boolean
        required: false
      template:
        description: "Studio template override (repository[:tag]), empty uses studios/*.yaml"
        default: ""
        type: string
        required: false
      labels:
        description: "Resource labels to add to the studio (key=value,...)"
        default: ""
        type: string
        required: false
      startup_timeout:
        description: "Minutes to wait for the studio to reach running"
        default: 30
        type: number
        required: false

        # schedule:
        #   # Every 3am, after the pipeline and studio heartbeat runs
        #   - cron: "0 3 * * *"

env:
  TOWER_API_ENDPOINT: ${{ secrets.STAGING_TOWER_ACCESS_ENDPOINT }}

# This workflow creates Studios in Tower, waits until they are running,
# keeps them running for a soak period, then stops, deletes and reports them.

# The 'launch' job runs the studios_autotest.py 'launch' sub-command to create
# each studio declared in studios/staging*.yaml and wait until it is running.
# It uploads the launch records as an artifact, even when a studio fails.

# The 'soak-stop-and-delete' job always runs after the soak period. It
# downloads the artifact, runs the 'finish' sub-command to check the studios
# are still running, stops and deletes them, writes the results table to the
# job summary and fails the run if any studio did not pass.
jobs:
  launch:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    env:
      TOWER_ACCESS_TOKEN: ${{ secrets.STAGING_TOWER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: install tw cli
        run: |
          set -euo pipefail
          wget -L https://github.com/seqeralabs/tower-cli/releases/download/v0.31.0/tw-linux-x86_64
          mv tw-* tw
          chmod +x tw
          sudo mv tw /usr/local/bin/

      - name: tower check
        run: |
          tw --version

      - name: launch_studios
        run: |
          uv run --locked python studios_autotest.py launch \
            -l DEBUG \
            -i \
            studios/staging*.yaml \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.template != '') && format('--template "{0}"', inputs.template) || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.labels != '') && format('--labels "{0}"', inputs.labels) || '--labels "automation=showcase"' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dryrun == true) && '--dryrun' || '' }} \
            --startup-timeout ${{ inputs.startup_timeout || 30 }} \
            -o ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}_launch_json
          path: ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}.json

  soak-stop-and-delete:
    runs-on: ubuntu-latest
    needs: [launch]
    # Always clean up, even when the launch job failed, so no studio is left running.
    if: always() && github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    environment: ${{ inputs.timer || 'delay15mins' }}
    env:
      TOWER_ACCESS_TOKEN: ${{ secrets.STAGING_TOWER_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}_launch_json
          path: run_details

      - name: Install tw CLI
        run: |
          set -euo pipefail
          wget -L https://github.com/seqeralabs/tower-cli/releases/download/v0.31.0/tw-linux-x86_64
          mv tw-* tw
          chmod +x tw
          sudo mv tw /usr/local/bin/

      - name: tower check
        run: |
          tw --version

      - name: setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: finish studios
        run: |
          uv run --locked python studios_autotest.py finish \
            -l DEBUG \
            -o ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}_studio_data.json \
            -i run_details/* \
            ${{ ( github.event_name != 'workflow_dispatch' || inputs.remove == true ) && '--delete' || '' }} \
            ${{ ( github.event_name != 'workflow_dispatch' || inputs.force == true ) && '--force' || '' }} \
            --fail-on-error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}_studio_data
          path: ${{ github.run_id }}_${{ github.run_number }}_${{ github.run_attempt }}_studio_data.json
