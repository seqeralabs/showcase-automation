name: studios-heartbeat-production

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        type: string
        description: Space separated list of workspace IDs
        default: "138659136604200 40230138858677"
      slack:
        description: Whether to send a Slack message
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM UTC every day

env:
  TOWER_API_ENDPOINT: "https://api.cloud.seqera.io"

jobs:
  check-studios:
    runs-on: ubuntu-latest
    env:
      TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: install tw cli
        run: |
          set -euo pipefail
          wget -L https://github.com/seqeralabs/tower-cli/releases/download/v0.31.0/tw-linux-x86_64
          mv tw-* tw
          chmod +x tw
          sudo mv tw /usr/local/bin/

      - name: tower check
        run: |
          tw --version

      - name: check_studios
        run: |
          uv run --locked python studios_api_test.py \
            -w ${{ github.event_name == 'workflow_dispatch' && inputs.workspace_id || '138659136604200 40230138858677' }} \
            --slack_channel ${{ secrets.SLACK_CHANNEL }} \
            ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slack)) && '--slack' || '' }}
